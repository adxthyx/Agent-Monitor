# Acme Home Goods knowledge base: the agent's only source of truth for policies.
facts:
  about: Acme Home Goods is an online store selling kitchenware, bedding and home decor.
  refund_window: Items can be returned for a full refund within 30 days of delivery.
  refund_condition: Returned items must be unused and in their original packaging. Sale items are final sale and cannot be returned.
  refund_method: Refunds go back to the original payment method within 5 to 7 business days after we receive the return.
  shipping_regions: We ship to the United States, Canada and the United Kingdom only.
  shipping_cost: Standard shipping is free on orders over $50; otherwise it costs $5.99.
  shipping_time: Standard shipping takes 3 to 5 business days. Express shipping takes 1 to 2 business days and costs $14.99.
  support_hours: Customer support is available Monday to Friday, 9am to 6pm Eastern Time.
  support_contact: "Support email: help@acmehome.example. Support phone: 1-800-555-0142."
  membership: Acme Plus is a membership costing $9 per month that includes free express shipping.
  cancel_membership: To cancel Acme Plus, go to Account > Membership > Cancel membership. Cancellation takes effect at the end of the current billing month.
  delete_data: Customers can request deletion of their account data at Account > Privacy > Delete my data. Deletion completes within 10 business days.
  price_match: Acme does not offer price matching.
  warranty: Small appliances carry a 1-year manufacturer warranty.
  gift_cards: Gift cards never expire and cannot be exchanged for cash.
  payment_methods: We accept Visa, Mastercard, American Express, PayPal and Acme gift cards.
  order_changes: Orders can be changed or cancelled within 1 hour of being placed.
  rewards: Acme Rewards gives 1 point per dollar spent; 100 points are worth $5 off.

