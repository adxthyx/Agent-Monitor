[project]
name = "agentmon"
version = "0.1.0"
description = "Semantic uptime monitor for AI agents: outside-in synthetic probes, graded by rules and LLM judges."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "jinja2>=3.1",
    "jsonpath-ng>=1.6",
    "jsonschema>=4.23",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
    "scipy>=1.14",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
agentmon = "agentmon.cli:app"

[dependency-groups]
dev = [
    "aiosmtpd>=1.4",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentmon", "demo_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
